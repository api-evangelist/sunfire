aid: sunfire
name: Sunfire
description: >-
  Sunfire SE is a German hydrogen technology manufacturer headquartered in Dresden, Saxony, with
  additional sites in Berlin and Solingen. Founded in 2010 by Carl Berninghausen, Christian von
  Olshausen and Nils Aldag, and converted to a European stock corporation (SE) in 2025, the company
  builds industrial-scale electrolyzers and power-to-X plants that convert renewable electricity into
  green hydrogen and synthetic fuels. Its Sunfire-HyLink portfolio spans pressurized alkaline
  electrolysis (HyLink Alkaline 22 at 10 MW and HyLink Alkaline 23 at 50 MW per module, operating at
  30 bar(g)) and high-temperature solid oxide electrolysis (HyLink SOEC, 10 MW modules, a claimed
  world-record 37.5 kWh/kg H2 efficiency), alongside FEED engineering, project delivery, maintenance
  and remote data-driven monitoring services. Customers and projects include RWE, Salzgitter, Neste,
  TotalEnergies, BASF, P2X Solutions, Nordic Ren-Gas and the Bad Lauchstaedt Energy Park. Sunfire is
  an industrial equipment manufacturer: it publishes no developer program, public API, SDK or
  machine-readable API contract of any kind.
